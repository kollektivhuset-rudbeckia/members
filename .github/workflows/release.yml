name: Build and publish image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # Never publish an image whose tests do not pass.
      - name: Test
        run: go test -count=1 ./...

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # latest=false switches off the action's implicit handling, so every
          # tag this image gets is spelled out under `tags` rather than
          # inferred. Note that both inputs are literal block scalars: a "#"
          # line inside them is data, not a comment, so keep remarks out here.
          flavor: |
            latest=false
          # Rules, in order:
          #   :latest        on the default branch, and on a stable release tag
          #                  (pre-releases carry a hyphen and must not move it)
          #   :main          the branch name
          #   :1.2.3, :1.2   from a v1.2.3 tag
          #   :sha-abc1234   every build, so a deploy can pin an exact commit
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      # Guards the rules above: :latest is easy to lose to a small edit here,
      # and the whole deploy story depends on it.
      - name: Check that :latest was derived
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "Tags for $REF:"
          echo "$TAGS" | sed 's/^/  /'
          case "$REF" in
            refs/tags/*-*)
              echo "Pre-release tag: :latest is intentionally left alone."
              exit 0
              ;;
            refs/tags/*|"refs/heads/$DEFAULT_BRANCH")
              ;;
            *)
              echo "Not a release build; :latest is not expected here."
              exit 0
              ;;
          esac
          if ! echo "$TAGS" | grep -q ':latest$'; then
            echo "::error::No :latest tag was derived for $REF"
            exit 1
          fi
          echo ":latest will be published."

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}" | sed 's/^/docker pull /'
            echo '```'
            echo
            echo "Digest: \`${{ steps.push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
